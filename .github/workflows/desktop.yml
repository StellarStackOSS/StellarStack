name: Desktop client

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — runs on Apple Silicon GitHub-hosted runner, cross-builds
          # the Intel slice via electron-builder's `--x64`.
          - label: macOS arm64
            os: macos-14
            ebargs: --mac --arm64
            goos: darwin
            goarch: arm64
          - label: macOS x64
            os: macos-15-intel
            ebargs: --mac --x64
            goos: darwin
            goarch: amd64
          # Windows — x64 on hosted runners, arm64 cross-built (no native
          # arm64 hosted runner yet, but electron-builder supports it).
          - label: Windows x64
            os: windows-latest
            ebargs: --win --x64
            goos: windows
            goarch: amd64
            daemonext: ".exe"
          - label: Windows arm64
            os: windows-latest
            ebargs: --win --arm64
            goos: windows
            goarch: arm64
            daemonext: ".exe"
          # Linux — x64 native, arm64 cross-built via GOARCH (electron-builder
          # produces AppImage for both).
          - label: Linux x64
            os: ubuntu-latest
            ebargs: --linux --x64
            goos: linux
            goarch: amd64
          - label: Linux arm64
            os: ubuntu-latest
            ebargs: --linux --arm64
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/daemon/go.sum

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        working-directory: apps/daemon
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../desktop/build
          go build -trimpath -ldflags "-s -w" -o "../desktop/build/stellar-daemon${{ matrix.daemonext }}" ./cmd/stellar-daemon

      - name: Bundle API + panel
        working-directory: apps/desktop
        run: pnpm build:tsc

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip auto-publishing; we attach artefacts manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.ebargs }} --publish never

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: stellarstack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: warn

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/latest*.yml
