<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:18080" />
    <title>StellarStack — Welcome</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #120F0C;
        --card: #201c19;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #f5f5f5;
        --muted: #a1a1aa;
        --accent: #A397E8;
        --error: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 11px;
        font-weight: 500;
        margin: 0;
      }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      p { color: var(--muted); font-size: 13px; margin: 0; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
      input {
        appearance: none;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        transition: border-color 0.15s;
      }
      input:focus { outline: none; border-color: var(--border-strong); }
      .fields { display: flex; flex-direction: column; gap: 14px; }
      button {
        appearance: none;
        border: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 11px 14px;
        border-radius: 8px;
        cursor: pointer;
        background: #fff;
        color: #18181b;
        transition: background-color 0.15s, opacity 0.15s;
      }
      button:hover { background: #e5e5e5; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .error {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: #fca5a5;
        font-size: 12px;
        padding: 10px 12px;
        border-radius: 8px;
      }
      .footnote { font-size: 11.5px; color: #71717a; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Welcome</p>
        <h1>Create your StellarStack admin</h1>
        <p>One-time setup. This account is local to your machine — there's no cloud and we don't see it.</p>
      </header>

      <form id="form" class="fields" autocomplete="off">
        <label>
          Display name
          <input id="displayName" type="text" required maxlength="80" placeholder="Marques" />
        </label>
        <label>
          Email
          <input id="email" type="email" required placeholder="you@example.com" />
        </label>
        <label>
          Password
          <input id="password" type="password" required minlength="8" placeholder="At least 8 characters" />
        </label>

        <div id="error" class="error" hidden></div>

        <button id="submit" type="submit">Continue</button>
        <p class="footnote">Forgot it later? You can reset from the panel after signing in.</p>
      </form>
    </main>

    <script>
      const form = document.getElementById("form");
      const submit = document.getElementById("submit");
      const error = document.getElementById("error");

      const showError = (msg) => {
        error.textContent = msg;
        error.hidden = false;
      };
      const clearError = () => {
        error.hidden = true;
      };

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        submit.disabled = true;
        submit.textContent = "Creating…";

        const displayName = document.getElementById("displayName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          await window.stellar.onboarding.complete({ displayName, email, password });
          // Main process closes this window + opens the panel; nothing
          // else to do here.
        } catch (err) {
          showError(typeof err === "string" ? err : err.message ?? "Something went wrong.");
          submit.disabled = false;
          submit.textContent = "Continue";
        }
      });
    </script>
  </body>
</html>
