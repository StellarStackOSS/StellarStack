appId: dev.stellarstack.desktop
productName: StellarStack
copyright: Copyright © StellarStack Inc.

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!**/*.map"

# Files copied into Electron's `resources/` dir at install time. The main
# process reads them via `process.resourcesPath` (see src/main/env.ts).
extraResources:
  # The built panel UI, configured to talk to the local API at
  # http://localhost:18080. Built by `pnpm bundle:web` (runs as part of
  # `build:tsc`) — distinct from `apps/web/dist`, which is built for
  # the hosted product with no API URL pinning.
  - from: build/web
    to: panel
    filter: ["**/*"]
  # The Go daemon binary. Build it for the target OS/arch ahead of time:
  #   GOOS=darwin GOARCH=arm64 go build -o stellar-daemon ./apps/daemon/cmd/stellar-daemon
  # Drop the result into `apps/desktop/build/` named per-platform.
  - from: build/
    to: .
    filter: ["stellar-daemon", "stellar-daemon.exe"]
  # The esbuilt API + a copy of the node_modules it depends on at runtime.
  # Built by `pnpm bundle:api` (runs as part of build:tsc).
  - from: build/api
    to: api
    filter: ["**/*"]
  # Drizzle SQL migrations the API auto-applies on first boot.
  - from: build/migrations
    to: migrations
    filter: ["**/*"]
  # Default blueprint catalog. The API seeds these on first launch when
  # the blueprints table is empty (STELLAR_BLUEPRINTS_PATH).
  - from: build/blueprints
    to: blueprints
    filter: ["**/*"]

# Don't try to compute channel info / auto-update YAML — we don't ship
# updates through electron-builder's publisher; releases go to GitHub
# directly via the workflow.
publish: null

mac:
  icon: icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Apple Developer ID available — skip electron-builder's signing
  # flow entirely and ad-hoc-sign in `afterSign` so the .app at least
  # has a consistent signature chain. Without ad-hoc sign, macOS shows
  # "StellarStack is damaged" on first launch from a downloaded DMG
  # because the bundled Electron Framework has Apple's signature but
  # the outer .app doesn't, and Gatekeeper's quarantine check rejects.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: StellarStack-mac-${arch}.${ext}

afterSign: scripts/afterSign.cjs

win:
  icon: icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: StellarStack-win-${arch}.${ext}

linux:
  icon: icons/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Utility
  artifactName: StellarStack-linux-${arch}.${ext}
